version: '3.8'

services:
  demo-store-backend:
    build:
      context: ./demo-store/backend
      dockerfile: Dockerfile
    container_name: shopagent-demo-store
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ShopAgent Demo Store Commerce API
      - API_V1_PREFIX=/api/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  shopagent-brain:
    build:
      context: ./agent-backend
      dockerfile: Dockerfile
    container_name: shopagent-brain
    ports:
      - "8001:8001"
    environment:
      - PROJECT_NAME=ShopAgent AI Associate Brain
      - API_V1_PREFIX=/api/v1
      - STORE_API_URL=http://demo-store-backend:8000/api/v1
    depends_on:
      - demo-store-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  demo-store-frontend:
    build:
      context: ./demo-store/frontend
      dockerfile: Dockerfile
    container_name: shopagent-demo-storefront
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_STORE_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_AGENT_API_URL=http://localhost:8001/api/v1
    depends_on:
      - demo-store-backend
      - shopagent-brain
    restart: unless-stopped
