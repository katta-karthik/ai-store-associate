version: '3.8'

services:
  demo-store-backend:
    build:
      context: ./demo-store/backend
      dockerfile: Dockerfile
    container_name: shopagent-demo-store
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ShopAgent Demo Store Commerce API
      - API_V1_PREFIX=/api/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
